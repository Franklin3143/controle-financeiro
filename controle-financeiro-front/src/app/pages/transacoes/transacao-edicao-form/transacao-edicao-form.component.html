<p-panel header="Editar Transação" *ngIf="!carregando">
  <form [formGroup]="form" (ngSubmit)="salvar()">
    <div class="p-fluid">
      <div class="p-field">
        <label for="descricao">Descrição</label>
        <input id="descricao" type="text" pInputText formControlName="descricao" />
      </div>

      <div class="p-field">
        <label for="valor">Valor</label>
        <input id="valor" type="number" pInputText formControlName="valor" />
      </div>

      <div class="p-field">
        <label for="data">Data</label>
        <input id="data" type="date" pInputText formControlName="data" />
      </div>

      <button type="submit" pButton label="Salvar" class="p-button-success"></button>
    </div>
  </form>
</p-panel>
